<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Reality Attribution research visual</title>
  <desc id="desc">A layered grid world, intervention paths and uncertainty traces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11131b"/><stop offset="1" stop-color="#050608"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d8ff35"/><stop offset="1" stop-color="#58f7c0"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7b61ff"/><stop offset="1" stop-color="#39a0ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="760" rx="36" fill="url(#bg)"/>
  <circle cx="930" cy="110" r="260" fill="#6f5cff" opacity=".12"/>
  <circle cx="220" cy="650" r="240" fill="#d8ff35" opacity=".08"/>
  <g transform="translate(88 95) rotate(-4 260 245)">
    <rect x="0" y="0" width="520" height="500" rx="28" fill="#11151b" stroke="#2a2f38"/>
    <g stroke="#29313b" stroke-width="2">
      <path d="M104 0V500M208 0V500M312 0V500M416 0V500"/>
      <path d="M0 100H520M0 200H520M0 300H520M0 400H520"/>
    </g>
    <circle cx="52" cy="450" r="18" fill="#d8ff35" filter="url(#glow)"/>
    <circle cx="468" cy="48" r="18" fill="#7b61ff" filter="url(#glow)"/>
    <path d="M52 450 C120 390 130 330 208 350 S300 360 312 260 S385 160 468 48" fill="none" stroke="url(#lime)" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 16"/>
    <path d="M52 450 C130 420 190 270 300 320 S380 210 468 48" fill="none" stroke="url(#violet)" stroke-width="4" opacity=".75"/>
    <rect x="212" y="206" width="96" height="96" rx="18" fill="#1c2230" stroke="#7b61ff" stroke-width="3"/>
    <text x="260" y="248" text-anchor="middle" fill="#fff" font-family="Arial" font-size="18" font-weight="700">OBS</text>
    <text x="260" y="274" text-anchor="middle" fill="#98a0ad" font-family="Arial" font-size="13">lag?</text>
  </g>
  <g transform="translate(660 118)">
    <text x="0" y="0" fill="#98a0ad" font-family="Arial" font-size="16" letter-spacing="4">ATTRIBUTION TRACE</text>
    <text x="0" y="54" fill="#fff" font-family="Georgia" font-size="54" font-weight="700">Environment.</text>
    <text x="0" y="110" fill="#fff" font-family="Georgia" font-size="54" font-weight="700">Memory.</text>
    <text x="0" y="166" fill="#d8ff35" font-family="Georgia" font-size="54" font-style="italic">Intervention.</text>
    <g transform="translate(0 225)">
      <path d="M0 92 C55 48 90 130 145 76 S238 24 298 82 S392 156 454 68" fill="none" stroke="#d8ff35" stroke-width="5"/>
      <path d="M0 126 C66 156 99 54 164 120 S264 180 326 102 S402 50 454 108" fill="none" stroke="#7b61ff" stroke-width="5" opacity=".8"/>
      <path d="M0 160H454" stroke="#303744"/>
      <g fill="#98a0ad" font-family="Arial" font-size="13"><text x="0" y="196">t0</text><text x="210" y="196">probe</text><text x="432" y="196">t+n</text></g>
    </g>
    <g transform="translate(0 480)">
      <rect width="454" height="96" rx="22" fill="#11151b" stroke="#2a2f38"/>
      <circle cx="50" cy="48" r="18" fill="#d8ff35" opacity=".9"/>
      <text x="84" y="42" fill="#fff" font-family="Arial" font-size="17" font-weight="700">Active probing</text>
      <text x="84" y="65" fill="#98a0ad" font-family="Arial" font-size="14">replaces passive guessing with evidence.</text>
    </g>
  </g>
</svg>
