<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Cognitive Mirror benchmark visual</title>
  <desc id="desc">Evidence spans, hard negatives and calibration indicators.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090d"/><stop offset="1" stop-color="#15111c"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff4fd8"/><stop offset="1" stop-color="#7b61ff"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="760" rx="36" fill="url(#bg)"/>
  <circle cx="1020" cy="80" r="260" fill="#ff4fd8" opacity=".12" filter="url(#blur)"/>
  <g transform="translate(70 78) rotate(-3 380 300)">
    <rect width="760" height="590" rx="32" fill="#f4f0e8"/>
    <text x="48" y="65" fill="#18181c" font-family="Arial" font-size="15" letter-spacing="4">ANNOTATION / 0417</text>
    <text x="48" y="125" fill="#111" font-family="Georgia" font-size="42" font-weight="700">What does the model</text>
    <text x="48" y="172" fill="#111" font-family="Georgia" font-size="42" font-weight="700">think the person feels?</text>
    <g font-family="Arial" font-size="22" fill="#3d3c42">
      <text x="48" y="250">The student reread the feedback, paused, and</text>
      <text x="48" y="288">closed the laptop before replying to anyone.</text>
      <rect x="267" y="223" width="270" height="34" rx="8" fill="#d8ff35" opacity=".8"/>
      <text x="48" y="344">A later message sounded calm, but the evidence</text>
      <text x="48" y="382">does not justify a confident emotional label.</text>
      <rect x="165" y="356" width="390" height="34" rx="8" fill="#ff72df" opacity=".35"/>
    </g>
    <g transform="translate(48 440)">
      <rect width="210" height="92" rx="20" fill="#11131a"/>
      <text x="24" y="35" fill="#9ba1ae" font-family="Arial" font-size="12" letter-spacing="2">LABEL</text>
      <text x="24" y="65" fill="#fff" font-family="Arial" font-size="22" font-weight="700">Abstain</text>
      <rect x="230" width="210" height="92" rx="20" fill="#11131a"/>
      <text x="254" y="35" fill="#9ba1ae" font-family="Arial" font-size="12" letter-spacing="2">EVIDENCE</text>
      <text x="254" y="65" fill="#fff" font-family="Arial" font-size="22" font-weight="700">Partial</text>
      <rect x="460" width="210" height="92" rx="20" fill="#11131a"/>
      <text x="484" y="35" fill="#9ba1ae" font-family="Arial" font-size="12" letter-spacing="2">AGREEMENT</text>
      <text x="484" y="65" fill="#d8ff35" font-family="Arial" font-size="22" font-weight="700">2 / 3</text>
    </g>
  </g>
  <g transform="translate(840 130)">
    <text x="0" y="0" fill="#9ba1ae" font-family="Arial" font-size="15" letter-spacing="4">MODEL BEHAVIOUR</text>
    <circle cx="150" cy="185" r="110" fill="none" stroke="#272b34" stroke-width="28"/>
    <path d="M150 75 A110 110 0 1 1 53 237" fill="none" stroke="url(#pink)" stroke-width="28" stroke-linecap="round"/>
    <text x="150" y="178" text-anchor="middle" fill="#fff" font-family="Georgia" font-size="52" font-weight="700">0.74</text>
    <text x="150" y="210" text-anchor="middle" fill="#a1a7b3" font-family="Arial" font-size="14">calibration</text>
    <g transform="translate(0 360)">
      <rect width="300" height="70" rx="18" fill="#12141b" stroke="#2c303a"/>
      <circle cx="34" cy="35" r="10" fill="#ff4fd8"/>
      <text x="58" y="31" fill="#fff" font-family="Arial" font-size="16" font-weight="700">Hard negative</text>
      <text x="58" y="50" fill="#8f96a3" font-family="Arial" font-size="12">looks obvious, is not justified</text>
      <rect y="86" width="300" height="70" rx="18" fill="#12141b" stroke="#2c303a"/>
      <circle cx="34" cy="121" r="10" fill="#d8ff35"/>
      <text x="58" y="117" fill="#fff" font-family="Arial" font-size="16" font-weight="700">Evidence span</text>
      <text x="58" y="136" fill="#8f96a3" font-family="Arial" font-size="12">show the exact supporting text</text>
      <rect y="172" width="300" height="70" rx="18" fill="#12141b" stroke="#2c303a"/>
      <circle cx="34" cy="207" r="10" fill="#7b61ff"/>
      <text x="58" y="203" fill="#fff" font-family="Arial" font-size="16" font-weight="700">Abstention</text>
      <text x="58" y="222" fill="#8f96a3" font-family="Arial" font-size="12">uncertainty becomes a valid output</text>
    </g>
  </g>
</svg>
